<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar — pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="sweep" aria-hidden="true"></span>
    <div>
      <h1>Token Launch Radar</h1>
      <p class="tagline">Protocols that record no token yet, ranked by what a token would be worth if their record stayed as it is - priced by a model fitted on the snapshot's own trading peers, with the record's odds beside every value.</p>
    </div>
  </div>
  <div class="stamp" id="stamp"></div>
</header>

<nav class="tabs" id="tabs" aria-label="Views">
  <button type="button" data-tab="board" class="on">Radar board</button>
  <button type="button" data-tab="live">Already trading</button>
  <button type="button" data-tab="method">How the ranking works</button>
</nav>

<main id="app" aria-busy="true"></main>

<footer class="foot" id="foot"></footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Protocol detail"></aside>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
